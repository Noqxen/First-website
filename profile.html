<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile - Pukar Poudel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Edit profile</h2>
            <form id="profileForm">
                <div class="avatar-row">
                    <img id="profileImage" class="avatar" src="" alt="Profile picture">
                    <input type="file" id="profilePicInput" accept="image/*" hidden>
                    <button type="button" onclick="document.getElementById('profilePicInput').click()" class="btn btn-quiet">Change picture</button>
                </div>
                <input type="text" id="profileName" placeholder="Full name" aria-label="Full name" required>
                <small id="nameWarning" class="field-note"></small>
                <input type="text" id="profileUsername" placeholder="Username" aria-label="Username" required>
                <small id="usernameWarning" class="field-note"></small>
                <button type="submit" class="btn">Update profile</button>
            </form>
            <p class="auth-switch"><a href="index.html">Back to home</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="profile.js"></script>
</body>
</html>
